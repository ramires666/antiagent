# Inert template. Replace every C:\ABSOLUTE\... placeholder before installation.
[mcp_servers.antigravity_cli_executor]
command = 'C:\ABSOLUTE\antiagent\.venv\Scripts\python.exe'
args = ['C:\ABSOLUTE\antiagent\agy_server.py']
cwd = 'C:\ABSOLUTE\antiagent'
experimental_environment = "local"
enabled = true
required = true
startup_timeout_sec = 30
tool_timeout_sec = 900
enabled_tools = [
  "antigravity_cli_execute",
  "antigravity_agent_spawn",
  "antigravity_agent_status",
  "antigravity_agent_list",
  "antigravity_agent_wait",
  "antigravity_agent_interrupt",
  "antigravity_agent_followup",
  "antigravity_doctor",
]

[mcp_servers.antigravity_cli_executor.env]
# Assertion only: verify actual placement with a live read-only MCP smoke.
ANTIAGENT_EXECUTION_BOUNDARY = "host"
ANTIAGENT_STATE_DIR = 'C:\ABSOLUTE\PRIVATE\antiagent-state'
# Optional when agy is not available through the host PATH:
# ANTIGRAVITY_CLI_PATH = 'C:\ABSOLUTE\agy\bin\agy.exe'
